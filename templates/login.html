{% extends "base.html" %}

{% block title %}UniTasker - Início{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}

<main class="container">
    
    <div class="logo-section">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-unitasker" alt="UniTasker">
    </div>

    <form class="form-card" action="{{ url_for('usuario.login') }}" method="POST">
        
        <input type="text" name="login" placeholder="Email ou Usuário*" required>
        
        <input type="password" name="senha" placeholder="Senha*" required>

        <button type="submit" class="btn-main">Entrar</button>

        <div class="divider">
            <span>Ou</span>
        </div>

        <button type="button" class="btn google">Continuar com Google</button>
        <button type="button" class="btn facebook">Continuar com Facebook</button>
        <button type="button" class="btn apple">Continuar com Apple</button>
    </form>

</main>

{% endblock %}
